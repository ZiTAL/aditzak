name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build database
        run: |
          npm run data:fetch
          npm run data:build

      - name: Typecheck, test and build
        run: npm run check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

  containers:
    name: Containers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose -f docker/compose.yaml config --quiet

      # GitHub-hosted runners and the target server use ordinary public CAs.
      # Do not add compose.ca.yaml or a proxy-specific certificate here.
      - name: Build and start containers without proxy overrides
        run: docker compose -f docker/compose.yaml up --build --detach

      - name: Verify the single port and API
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8006/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose -f docker/compose.yaml logs
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8006/ >/dev/null
          curl --fail --silent http://127.0.0.1:8006/api/v1/meta | jq --exit-status '.complete == true'
          curl --fail --silent 'http://127.0.0.1:8006/api/v1/analyze?form=hatzait' | jq --exit-status '.analyses | length > 0'

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker/compose.yaml logs

      - name: Stop containers
        if: always()
        run: docker compose -f docker/compose.yaml down
